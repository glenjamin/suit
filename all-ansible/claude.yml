---
- hosts: all
  tasks:

  - name: make claude config dir
    file:
      path: "{{ ansible_user_dir }}/.claude"
      state: directory
  - name: symlink claude config
    file:
      src: "{{playbook_dir}}/files/claude/{{ item }}"
      path: "{{ ansible_user_dir }}/.claude/{{ item }}"
      state: link
      force: yes
    loop:
      - CLAUDE.md
      - settings.json
      - keybindings.json
      - skills
      - commands
      - scripts

  - name: make Geckoboard dir
    file:
      path: "{{ ansible_user_dir }}/Development/Geckoboard"
      state: directory
  - name: symlink Geckoboard-scoped claude config
    file:
      src: "{{playbook_dir}}/files/geckoboard-CLAUDE.md"
      path: "{{ ansible_user_dir }}/Development/Geckoboard/CLAUDE.md"
      state: link
      force: yes
